name: CI Pipeline

on:
  push:
    branches: [ "stagging" ]
  pull_request:
    branches: [ "stagging" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. PASTIKAN TIDAK ADA blok 'defaults: run: working-directory' di sini

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # 2. Karena file ada di root, cukup tulis nama filenya langsung
        cache-dependency-path: package-lock.json 

    # 3. Semua perintah di bawah ini berjalan langsung di root repositori
    - name: Install Dependencies
      run: npm ci

    - name: Run Linter & Typecheck
      run: |
        npm run lint
        npm run typecheck

    - name: Run Tests
      run: npm test
