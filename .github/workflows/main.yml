name: CI Pipeline

on:
  push:
    branches: [ "stagging" ]
  pull_request:
    branches: [ "stagging" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # SOLUSI: Menetapkan folder proyek sebagai direktori kerja utama untuk JOB ini
    defaults:
      run:
        working-directory: LearnPoint_Mobile

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      # Catatan: Checkout tidak terpengaruh oleh 'defaults.run', ia akan tetap mengunduh ke root repositori.

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Kembalikan ke path subfolder karena pencarian awal dimulai dari root repositori
        cache-dependency-path: LearnPoint_Mobile/package-lock.json

    # Sekarang semua langkah di bawah ini otomatis berjalan di dalam folder 'LearnPoint_Mobile'
    # Tanpa perlu menuliskan 'working-directory' lagi di setiap step.
    - name: Install Dependencies
      run: npm ci

    - name: Run Linter & Typecheck
      run: |
        npm run lint
        npm run typecheck

    - name: Run Tests
      run: npm test
